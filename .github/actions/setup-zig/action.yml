name: Set up Zig and the Zig cache of this native target
description: >
  Installs Zig at a fixed path with mlugg/setup-zig and restores .zig-cache
  from a cache entry of the same native target. Run save-zig-cache as the
  last step of the job.

# This action removes two causes of a Zig cache miss in CI.
#
# 1. The Zig path. Without the tool cache, setup-zig extracts Zig to a new
#    random folder in each job ($RUNNER_TEMP/<uuid>). translate-c writes the
#    path of the Zig lib/include headers into its output (the comments of
#    the macros that it cannot translate). Thus sdl.zig changes in each job,
#    and each native program that imports SDL compiles again (30 s to 60 s
#    for voxel). With use-tool-cache, Zig is always at the same path in the
#    tool cache.
#
# 2. The CPU. Zig compiles for the native CPU by default. The build runner,
#    the translate-c tool and each native artifact are thus compiled for the
#    CPU of the runner, and the CPU is part of their cache hash. GitHub gives
#    runners with different CPUs (Zig finds znver3, znver4, znver5,
#    icelake_server, emeraldrapids and graniterapids). A cache entry of
#    another CPU has none of these artifacts, and the voxel build takes
#    125 s to 210 s.
#
# The key uses the native target that Zig finds (zig targets): the CPU
# name, and a hash of the triple, the CPU name and the CPU features. Thus
# two runners share an entry only when Zig compiles the same code on both.
# The key of each entry is:
#   zig-<zig version>-<Zig CPU name>-<native target hash>-<group>-<part>-<run id>-<attempt>
# The restore tries the newest entry of the same group and part first, and
# then the newest entry of the same group. Jobs that build the same
# programs use one group, so that each one can use an entry of the others.
# setup-zig cannot do this: its key always contains the job name.

inputs:
  group:
    description: The cache group. Jobs that build the same programs use the same group.
    required: true
  part:
    description: The part of the job in the group, for example the matrix value.
    required: true

runs:
  using: composite
  steps:
    - name: Install Zig
      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      # setup-zig sets ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR to
      # .zig-cache also when use-cache is false.
      uses: mlugg/setup-zig@v2
      with:
        use-cache: false
        use-tool-cache: true

    - name: Make the Zig cache key
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        PART: ${{ inputs.part }}
      run: |
        model=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)
        native=$(zig targets | sed -n '/^    \.native = /,/^    },/p')
        triple=$(printf '%s\n' "$native" | sed -n 's/^ *\.triple = "\(.*\)",$/\1/p')
        cpu=$(printf '%s\n' "$native" | sed -n 's/^ *\.name = "\(.*\)",$/\1/p' | head -n 1)
        hash=$(printf '%s\n' "$native" | sha256sum | cut -c 1-8)
        echo "Zig: $(command -v zig)"
        echo "CPU model: $model"
        echo "Zig native target: $triple, CPU $cpu (hash $hash)"
        base="zig-$(zig version)-$cpu-$hash-$GROUP-"
        {
          echo "ZIG_VERSION=$(zig version)"
          echo "ZIG_CACHE_GROUP=$base"
          echo "ZIG_CACHE_PART=$base$PART-"
          echo "ZIG_CACHE_KEY=$base$PART-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        } >> "$GITHUB_ENV"

    - name: Restore the Zig cache
      uses: actions/cache/restore@v4
      with:
        path: .zig-cache
        key: ${{ env.ZIG_CACHE_KEY }}
        restore-keys: |
          ${{ env.ZIG_CACHE_PART }}
          ${{ env.ZIG_CACHE_GROUP }}

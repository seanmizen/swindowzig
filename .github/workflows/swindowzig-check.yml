name: Check (swindowzig)

# Builds swindowzig, runs its unit tests and its web tests, and renders the
# voxel regression scenes with lavapipe (Mesa software Vulkan). Each frame
# must match its golden in examples/voxel/assets/goldens/lavapipe/. Without
# this check the goldens went stale with nobody aware of it.
#
# The checks do not depend on each other, so each group runs in its own job
# at the same time as the others. Each job installs only the tools that its
# checks use:
#   zig       Zig, Node and SDL2: format, unit tests, terrain hash.
#   web       Zig and Bun: the web builds and the Bun tests.
#   browser   Zig, Bun, Node packages and Chromium: tsc and Playwright.
#   examples  Zig, lavapipe, SDL2, wgpu-native: the --check examples.
#   headless  Zig, lavapipe, SDL2, wgpu-native: each TAS script, cave cull.
#   goldens   Zig, lavapipe, SDL2, wgpu-native: the golden comparison.
#
# Caches: setup-zig keeps the Zig cache of each job under a key with the job
# name, so two jobs do not write the same cache. The apt packages come from
# a cache of the .deb files (cache-apt-pkgs-action). The Playwright browser
# comes from a cache with the Playwright version of yarn.lock in its key.
#
# A failed comparison is either a regression or a deliberate visual change.
# For a deliberate change, the goldens job uploads new goldens and prints
# the command that puts them in the repo. Commit them on the same branch.

on:
  pull_request:
    branches: [main]
  # A merge that skipped the check is still caught on main.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zig:
    name: format + unit tests + terrain hash
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 (from the apt cache)
        # The sw_audio API tests link SDL2 (with the dummy audio driver).
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libsdl2-dev
          version: 1

      - name: Install Zig
        # No version: setup-zig reads minimum_zig_version from build.zig.zon.
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Format
        run: zig fmt --check .

      - name: Unit tests
        run: zig build test --summary all

      - name: Terrain hash, native and wasm
        # Terrain must be identical on every platform and in every engine.
        # Native and wasm (in Node) print the block hash of each seed. The
        # two outputs must be equal. Seed 0 must keep its pinned hash.
        run: |
          zig build terrain-hash -Doptimize=ReleaseFast
          ./zig-out/bin/terrain_hash 0 1 12345 > "$RUNNER_TEMP/terrain-native.txt"
          node examples/voxel/scripts/terrain_hash_wasm.mjs 0 1 12345 > "$RUNNER_TEMP/terrain-wasm.txt"
          echo "native:" && cat "$RUNNER_TEMP/terrain-native.txt"
          echo "wasm (node $(node --version)):" && cat "$RUNNER_TEMP/terrain-wasm.txt"
          diff "$RUNNER_TEMP/terrain-native.txt" "$RUNNER_TEMP/terrain-wasm.txt"
          grep -qx '0 db5d8508a4c6cd54' "$RUNNER_TEMP/terrain-native.txt"

  web:
    name: web build + Bun tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Web build
        run: zig build web -Dexample=voxel -Doptimize=ReleaseFast

      - name: Headless run of the voxel web build in Bun
        # app.wasm runs with stub WebGPU imports. The player flies 5 chunks
        # from spawn. The step fails if the chunks near the player are not
        # loaded and meshed. CI then tests the wasm-only code paths too.
        # The first run uses the chunk worker pool (real Bun Web Workers
        # with chunks.wasm), and fails if a chunk job runs on the main
        # thread. The second run uses the Inline executor (no pool).
        run: |
          bun backends/wasm/headless.ts --wasm zig-out/bin/app.wasm
          bun backends/wasm/headless.ts --wasm zig-out/bin/app.wasm --workers 0

      - name: Chunk worker pool tests in Bun
        # Real Web Workers: the pool gives the state of the Inline executor
        # with random edits, a worker that stops starts again, the fallback
        # works, and a chunks.wasm of another build does not start.
        run: bun test backends/wasm/worker-pool.test.ts

      - name: Web input tests in Bun
        # The key numbers and the wheel deltas that events.ts sends.
        run: bun test backends/wasm/events.test.ts

      - name: Web audio mixer pump tests in Bun
        # The blocks that sw_audio mixes play on the audio clock with no gap.
        run: bun test backends/wasm/audio.test.ts

      - name: Player files and cache tests in Bun
        # sw_assets in wasm with files.ts: dropped files, the OPFS cache, and
        # the error on a page that is not a secure context.
        run: bun test backends/wasm/files.test.ts

      - name: Seed parser tests in Bun
        # The seed of the page URL: valid, the largest u64, negative, not a
        # number, too large, empty (REQ-VOXEL-034).
        run: bun test backends/wasm/seed.test.ts

      - name: WebSocket bridge tests in Bun
        # sw_net in wasm with websocket.ts, against a local Bun server:
        # binary and text messages, the close codes, and the reconnect.
        run: bun test backends/wasm/websocket.test.ts

  browser:
    name: tsc + browser tests in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        # The Playwright web servers build flat2d and justabox for the web.
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Set up Bun
        # The Playwright web servers run the Bun dev server.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Mesa Vulkan (from the apt cache)
        # The old single job had these packages when the browser tests ran,
        # and justabox passed there. Without them, Chromium got a WebGPU
        # adapter, but the device dropped ("Instance dropped in
        # popErrorScope"). This job does not set VK_LOADER_DRIVERS_SELECT,
        # so Chromium can still use SwiftShader.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers vulkan-tools
          version: 1

      - name: Refresh the library cache
        # cache-apt-pkgs-action does not run the postinst scripts.
        run: sudo ldconfig

      - name: Install the Node packages
        run: yarn install --immutable

      - name: Type check of backends/wasm
        run: yarn typecheck:web

      - name: Bundle boot.js and chunk-worker.js (RSBuild)
        # The same bundles as `yarn build`. A bundle error fails this step.
        run: |
          yarn build:js
          test -s zig-out/bin/boot.js
          test -s zig-out/bin/chunk-worker.js

      - name: Find the Playwright version
        id: playwright
        run: |
          version=$(sed -n '/^"playwright@npm:/,/^$/s/^  version: //p' yarn.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium cache
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium
        # The runner image has Google Chrome, and thus the system libraries
        # of Chromium. This step does not use --with-deps, so a cache hit
        # and a cache miss start the same browser on the same libraries.
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --only-shell chromium

      - name: Browser tests in Chromium (flat2d and canvas)
        # Playwright opens flat2d and justabox with WebGPU. Chromium uses
        # its own SwiftShader Vulkan driver. This job does not set
        # VK_LOADER_DRIVERS_SELECT: the filter '*lvp*' hides SwiftShader
        # and gives no WebGPU adapter. The tests move the focus with Tab
        # and read the accessibility tree (REQ-A11Y-001), among others.
        # The flat2d tests run 10 times with no retry. A flaky test then
        # fails the step (REQ-INPUT-007).
        run: |
          yarn test:browser --project canvas
          yarn test:browser --project flat2d --repeat-each=10 --retries=0

  examples:
    name: native examples (--check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # lavapipe is the only Vulkan driver on the runner. Name it anyway.
      VK_LOADER_DRIVERS_SELECT: '*lvp*'
      # build.zig links wgpu-native from ~/.local/lib.
      LD_LIBRARY_PATH: /home/runner/.local/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lavapipe and SDL2 (from the apt cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers vulkan-tools libsdl2-dev
          version: 1

      - name: Check that lavapipe works
        run: |
          sudo ldconfig
          vulkaninfo --summary | grep -i llvmpipe

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Install wgpu-native
        # The same version as the bindings in libs/sw_gpu/src/native_webgpu.zig.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wgpu.zip" \
            https://github.com/gfx-rs/wgpu-native/releases/download/v22.1.0.5/wgpu-linux-x86_64-release.zip
          mkdir -p ~/.local
          unzip -q "$RUNNER_TEMP/wgpu.zip" -d ~/.local

      - name: Web and native build of the 2D example (flat2d)
        run: |
          zig build web -Dexample=flat2d
          zig build native -Dexample=flat2d

      - name: GPU mip levels (mipmaps --check)
        # The example makes the mip levels of a texture array on the GPU,
        # reads each level back and compares it with the CPU reference
        # (REQ-GPU-001, REQ-GPU-002). The web build must compile too.
        run: |
          zig build web -Dexample=mipmaps
          zig build native -Dexample=mipmaps
          ./zig-out/bin/mipmaps --check

      - name: Texture atlas and animated sprites (atlas --check)
        # The example builds an atlas with sw_render, reads each mip level
        # back, then moves the time forward and checks the GPU copies of
        # the animated sprites (REQ-GPU-003, REQ-GPU-004). The web build
        # must compile too.
        run: |
          zig build web -Dexample=atlas
          zig build native -Dexample=atlas
          ./zig-out/bin/atlas --check

      - name: HDR target, tonemap and FXAA (justabox --check)
        # The box draws into the HDR target. The post chain runs the
        # tonemap and FXAA. The example reads the screen back, compares the
        # background with the CPU tonemap, and checks that FXAA changes the
        # box edges only (REQ-GPU-008, REQ-GPU-009). The web build must
        # compile too.
        run: |
          zig build web -Dexample=justabox
          zig build native -Dexample=justabox
          ./zig-out/bin/justabox --check

      - name: Sky, fog and the time of day (sky --check)
        # The sky pass and a fogged scene draw into the HDR target. The
        # example reads the screen back at noon, at sunrise, at midnight
        # and with the cube map, and compares the sky and the ground with
        # the CPU reference after the tonemap (REQ-GPU-010, REQ-GPU-011).
        # The web build must compile too.
        run: |
          zig build web -Dexample=sky
          zig build native -Dexample=sky
          ./zig-out/bin/sky --check

      - name: Box models and the first-person pass (models --check)
        # The example draws the box models with one draw call for each
        # model, and the held object in the first-person pass. It reads the
        # screen back and compares it with the CPU reference after the
        # tonemap (REQ-GPU-014, REQ-GPU-015). The web build must compile too.
        run: |
          zig build web -Dexample=models
          zig build native -Dexample=models
          ./zig-out/bin/models --check

  headless:
    name: voxel TAS scripts + cave cull (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VK_LOADER_DRIVERS_SELECT: '*lvp*'
      LD_LIBRARY_PATH: /home/runner/.local/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lavapipe and SDL2 (from the apt cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers vulkan-tools libsdl2-dev
          version: 1

      - name: Check that lavapipe works
        run: |
          sudo ldconfig
          vulkaninfo --summary | grep -i llvmpipe

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Install wgpu-native
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wgpu.zip" \
            https://github.com/gfx-rs/wgpu-native/releases/download/v22.1.0.5/wgpu-linux-x86_64-release.zip
          mkdir -p ~/.local
          unzip -q "$RUNNER_TEMP/wgpu.zip" -d ~/.local

      - name: Native build
        run: zig build native -Dexample=voxel

      - name: Each voxel TAS script runs headless
        # A TAS script that does not parse stops voxel with an error. Each
        # script in examples/voxel/tests/ runs on the flatland world and
        # must exit 0. The goldens and cave_cull.sh compare frames of some
        # of these scripts. This step catches the other scripts.
        run: |
          status=0
          for tas in examples/voxel/tests/*.tas; do
            if timeout 200 ./zig-out/bin/voxel --headless --world=flatland --tas "$tas" > "$RUNNER_TEMP/tas.log" 2>&1; then
              echo "PASS $tas"
            else
              echo "FAIL $tas (exit $?)"
              tail -n 20 "$RUNNER_TEMP/tas.log"
              status=1
            fi
          done
          exit $status

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: The URL seed of app.wasm gives the terrain of native --seed
        # Native voxel and app.wasm (in Bun, with and without the worker
        # pool) print the hash of the world around the player. The hashes
        # must be equal for each seed (REQ-VOXEL-034).
        timeout-minutes: 10
        run: |
          zig build web -Dexample=voxel -Doptimize=ReleaseFast
          ./examples/voxel/tests/seed_web_native.sh

      - name: A TAS parse error stops voxel with no leak
        # The debug build reports each leak at exit (REQ-VOXEL-033).
        run: ./examples/voxel/tests/tas_parse_fail.sh

      - name: Cave cull, section cull and occlusion cull
        # Each cull must give the same frame as the frustum cull only
        # (REQ-VOXEL-020, REQ-VOXEL-024, REQ-VOXEL-025).
        timeout-minutes: 15
        run: ./examples/voxel/tests/cave_cull.sh --skip-build

  goldens:
    name: voxel goldens (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VK_LOADER_DRIVERS_SELECT: '*lvp*'
      LD_LIBRARY_PATH: /home/runner/.local/lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lavapipe and SDL2 (from the apt cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers vulkan-tools libsdl2-dev
          version: 1

      - name: Check that lavapipe works
        run: |
          sudo ldconfig
          vulkaninfo --summary | grep -i llvmpipe

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          cache-key: ${{ github.job }}

      - name: Install wgpu-native
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wgpu.zip" \
            https://github.com/gfx-rs/wgpu-native/releases/download/v22.1.0.5/wgpu-linux-x86_64-release.zip
          mkdir -p ~/.local
          unzip -q "$RUNNER_TEMP/wgpu.zip" -d ~/.local

      - name: Native build
        run: zig build native -Dexample=voxel

      - name: Compare with the goldens
        # The step takes about 1.5 minutes. The script stops a run after
        # 120 s and shows each golden before it starts. The step limit
        # stops a hang outside the runs.
        id: goldens
        timeout-minutes: 10
        run: ./examples/voxel/scripts/run_headless_regressions.sh --out "$RUNNER_TEMP/frames"

      - name: Make new goldens
        if: failure() && steps.goldens.outcome == 'failure'
        timeout-minutes: 10
        run: ./examples/voxel/scripts/run_headless_regressions.sh --update --out "$RUNNER_TEMP/frames/update"

      - name: Upload the new goldens
        if: failure() && steps.goldens.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: voxel-lavapipe-goldens
          path: examples/voxel/assets/goldens/lavapipe/*.ppm.gz
          if-no-files-found: ignore

      - name: Upload the frames and logs
        if: failure() && steps.goldens.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: voxel-frames
          path: ${{ runner.temp }}/frames
          if-no-files-found: ignore

      - name: How to accept a deliberate visual change
        if: failure() && steps.goldens.outcome == 'failure'
        run: |
          echo "If the change to the frames is deliberate, run this from the repo root and commit the result:"
          echo
          echo "  rm examples/voxel/assets/goldens/lavapipe/*.ppm.gz"
          echo "  gh run download ${{ github.run_id }} -R ${{ github.repository }} -n voxel-lavapipe-goldens -D examples/voxel/assets/goldens/lavapipe"
          echo
          echo "(gh run download does not overwrite files, so remove the old goldens first.)"
          echo
          echo "If not, the frames and logs are in the voxel-frames artifact."

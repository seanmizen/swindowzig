# Publishes swindowzig as a Zig package. Push a tag `v<version>` and
# this workflow builds swindowzig.tar.gz, proves a consumer project can build
# against it, and attaches it to a GitHub Release.
#
# The archive root holds the paths in build.zig.zon `.paths`, because the Zig
# package manager needs build.zig at the archive root. It has no docs/.
#
# The pull_request and workflow_dispatch runs do the same build and consumer
# check, and skip the publish. A tag push is the only trigger that publishes.
name: swindowzig release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: archive + consumer build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        # No version: setup-zig reads minimum_zig_version from build.zig.zon.
        uses: mlugg/setup-zig@v2

      - name: Check the tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match .version ${version} in build.zig.zon." >&2
            exit 1
          fi

      - name: Make swindowzig.tar.gz
        run: |
          # The .paths list in build.zig.zon names what goes in the archive.
          paths="$(sed -n '/\.paths = \.{/,/^    },/p' build.zig.zon | grep -o '"[^"]*"' | tr -d '"')"
          echo "Archive paths:" $paths
          tar -czf "$RUNNER_TEMP/swindowzig.tar.gz" $paths
          tar -tzf "$RUNNER_TEMP/swindowzig.tar.gz" | grep -qx 'build.zig'
          tar -tzf "$RUNNER_TEMP/swindowzig.tar.gz" | grep -qx 'LICENSE'
          if tar -tzf "$RUNNER_TEMP/swindowzig.tar.gz" | grep -q '^docs'; then
            echo "The archive has docs/." >&2
            exit 1
          fi

      - name: Build a consumer project against the archive
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > build.zig <<'ZIG'
          const std = @import("std");

          pub fn build(b: *std.Build) void {
              const optimize = b.standardOptimizeOption(.{});
              const swindowzig = b.dependency("swindowzig", .{ .optimize = optimize });
              const exe = b.addExecutable(.{
                  .name = "consumer",
                  .root_module = b.createModule(.{
                      .root_source_file = b.path("main.zig"),
                      .target = b.resolveTargetQuery(.{ .cpu_arch = .wasm32, .os_tag = .freestanding }),
                      .optimize = optimize,
                  }),
              });
              exe.root_module.addImport("sw_app", swindowzig.module("sw_app"));
              exe.rdynamic = true;
              b.installArtifact(exe);
          }
          ZIG
          cat > main.zig <<'ZIG'
          const sw = @import("sw_app");

          pub fn main() !void {
              try sw.run(.{ .title = "consumer" }, struct {});
          }
          ZIG
          cat > build.zig.zon <<'ZIG'
          .{
              .name = .consumer,
              .version = "0.0.0",
              .fingerprint = 0x705b3727bc4a41c3,
              .minimum_zig_version = "0.17.0",
              .dependencies = .{},
              .paths = .{ "build.zig", "build.zig.zon", "main.zig" },
          }
          ZIG
          # `zig fetch --save` pins the archive by path and hash, as a
          # dependent repo pins it by URL and hash.
          zig fetch --save "$RUNNER_TEMP/swindowzig.tar.gz"
          cat build.zig.zon
          zig build --summary all
          test -s zig-out/bin/consumer.wasm

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: swindowzig.tar.gz
          path: ${{ runner.temp }}/swindowzig.tar.gz

  publish:
    name: publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swindowzig.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/swindowzig.tar.gz"
          cat > notes.md <<NOTES
          swindowzig ${GITHUB_REF_NAME#v}, a Zig package.

          Add it to a Zig project:

          \`\`\`
          zig fetch --save ${url}
          \`\`\`

          Then, in build.zig:

          \`\`\`zig
          const swindowzig = b.dependency("swindowzig", .{});
          exe.root_module.addImport("sw_app", swindowzig.module("sw_app"));
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" swindowzig.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

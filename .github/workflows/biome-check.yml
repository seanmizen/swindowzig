name: Check (Biome)

# Runs Biome (lint and format) on the whole repo. `yarn fix` runs the same
# rules on Sean's machine. Without this job, a Biome error can merge to main,
# and the next `yarn fix` fails on a file that the change did not touch.
#
# There is no `yarn install`: npx gets only Biome, at the version that
# package.json pins, so this job and `yarn fix` use the same rules.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  biome:
    name: biome ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Biome
        run: |
          version="$(node -p "require('./package.json').devDependencies['@biomejs/biome']")"
          npx --yes "@biomejs/biome@$version" ci .
